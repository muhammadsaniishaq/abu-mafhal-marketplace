<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Abu Mafhal Marketplace</title>

  <style>
    html, body, #root {
      touch-action: manipulation !important;
      -webkit-text-size-adjust: 100% !important;
      overflow-x: hidden !important;
    }
    @media screen and (max-width: 768px) {
      input, select, textarea, [role="textbox"], [contenteditable="true"] {
        font-size: 16px !important;
      }
    }
  </style>

  <script>
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
    document.addEventListener('dblclick', function (e) {
      e.preventDefault();
    }, { passive: false });
  </script>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
