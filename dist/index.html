<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
  <meta name="HandheldFriendly" content="true" />
  <meta name="MobileOptimized" content="width" />
  <title>Abu Mafhal Marketplace</title>

  <!-- INSTANT ZERO-DELAY MOBILE GATEWAY: Permanently routes mobile users to /mobile -->
  <script>
    (function () {
      try {
        var path = window.location.pathname || '';
        if (path.indexOf('/mobile') === 0) return;

        var search = window.location.search || '';
        if (search.indexOf('force=web') !== -1 || search.indexOf('force=desktop') !== -1) {
          try { sessionStorage.setItem('abumafhal_force_web', 'true'); } catch (_) {}
          return;
        }
        try {
          if (sessionStorage.getItem('abumafhal_force_web') === 'true') return;
        } catch (_) {}

        var ua = navigator.userAgent || navigator.vendor || window.opera || '';
        var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Silk/i.test(ua);
        var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0);
        var isSmallScreen = (window.innerWidth && window.innerWidth <= 820) || (window.screen && window.screen.width <= 820);

        if (isMobileUA || (isTouch && isSmallScreen)) {
          var targetHash = '';
          var lowPath = path.toLowerCase();
          if (lowPath.indexOf('admin') !== -1) targetHash = '#admin';
          else if (lowPath.indexOf('vendor') !== -1) targetHash = '#vendor';
          else if (lowPath.indexOf('driver') !== -1) targetHash = '#driver';
          else if (lowPath.indexOf('shop') !== -1) targetHash = '#shop';
          else if (lowPath.indexOf('cart') !== -1) targetHash = '#cart';
          else if (lowPath.indexOf('checkout') !== -1) targetHash = '#checkout';
          else if (lowPath.indexOf('order') !== -1 || lowPath.indexOf('track') !== -1) targetHash = '#orders';
          else if (lowPath.indexOf('login') !== -1 || lowPath.indexOf('auth') !== -1 || lowPath.indexOf('register') !== -1 || lowPath.indexOf('join') !== -1) {
            var parts = lowPath.split('/').filter(Boolean);
            var lastPart = parts[parts.length - 1];
            if (lowPath.indexOf('join') !== -1 && lastPart && lastPart !== 'join') {
              targetHash = '#auth?code=' + encodeURIComponent(lastPart);
            } else {
              targetHash = '#auth';
            }
          }
          else if (lowPath.indexOf('profile') !== -1) targetHash = '#profile';
          else if (lowPath.indexOf('wishlist') !== -1) targetHash = '#wishlist';
          else if (lowPath.indexOf('wallet') !== -1) targetHash = '#wallet';
          else if (lowPath.indexOf('stores') !== -1) targetHash = '#stores';
          else if (lowPath.indexOf('product') !== -1) {
            var prodParts = lowPath.split('/').filter(Boolean);
            var prodId = prodParts[prodParts.length - 1];
            if (prodId && prodId !== 'product') {
              targetHash = '#product/' + encodeURIComponent(prodId);
            }
          }
          window.location.replace('/mobile' + targetHash);
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* ── STRICT ZERO ZOOM CONFIGURATION ── */
    html, body, #root {
      touch-action: pan-x pan-y !important;
      -webkit-text-size-adjust: 100% !important;
      -moz-text-size-adjust: 100% !important;
      text-size-adjust: 100% !important;
      overflow-x: hidden !important;
      width: 100% !important;
      max-width: 100vw !important;
      position: relative !important;
    }

    *, *::before, *::after {
      touch-action: pan-x pan-y !important;
      -webkit-touch-callout: none !important;
    }

    /* Kange input auto-zoom a kowace wayar hannu (iOS Safari da Android Chrome) */
    input, select, textarea, [role="textbox"], [contenteditable="true"] {
      font-size: 16px !important;
    }
  </style>

  <script>
    (function () {
      // 1. Hana Multi-touch Pinch Zoom a Touchstart, Touchmove, Touchend (Capture phase)
      function killPinch(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }
      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {
        window.addEventListener(type, killPinch, { passive: false, capture: true });
        document.addEventListener(type, killPinch, { passive: false, capture: true });
      });

      // 2. Kange iOS WebKit touchmove e.scale da touches > 1
      document.addEventListener('touchmove', function (e) {
        if ((e.scale !== undefined && e.scale !== 1) || (e.touches && e.touches.length > 1)) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });

      // 3. Hana iOS Safari native gesture events (pinch zoom)
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (eventName) {
        window.addEventListener(eventName, function (e) {
          e.preventDefault();
        }, { passive: false, capture: true });
        document.addEventListener(eventName, function (e) {
          e.preventDefault();
        }, { passive: false, capture: true });
      });

      // 4. Hana Double-Tap Zoom a Touchend
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false, capture: true });

      // 5. Hana dblclick
      window.addEventListener('dblclick', function (e) {
        e.preventDefault();
      }, { passive: false, capture: true });

      // 6. Hana Ctrl + Wheel / Trackpad pinch zoom
      window.addEventListener('wheel', function (e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // 7. Hana keyboard zoom (Ctrl + '+' / Ctrl + '-')
      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      }, { capture: true });

      // 8. Visual Viewport Reset: Idan browser ya canza scale, mayar da shi 1.0 nan take
      if (window.visualViewport) {
        var resetScale = function () {
          if (window.visualViewport.scale !== 1) {
            var meta = document.querySelector('meta[name="viewport"]');
            if (meta) {
              meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover';
            }
          }
        };
        window.visualViewport.addEventListener('resize', resetScale);
        window.visualViewport.addEventListener('scroll', resetScale);
      }

      // 9. Tabbatar da font-size 16px a kowane input lokacin da aka taba shi don hana focus-zoom
      document.addEventListener('focusin', function (e) {
        if (e.target && /^(INPUT|SELECT|TEXTAREA)$/i.test(e.target.tagName)) {
          e.target.style.fontSize = '16px';
        }
      }, { capture: true });
    })();
  </script>
