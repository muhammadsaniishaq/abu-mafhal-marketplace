<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
  <meta name="HandheldFriendly" content="true" />
  <meta name="MobileOptimized" content="width" />
  <title>Abu Mafhal Marketplace</title>

  <style>
    /* ── STRICT ZERO ZOOM CONFIGURATION ── */
    html, body, #root {
      touch-action: pan-y manipulation !important;
      -webkit-text-size-adjust: 100% !important;
      -moz-text-size-adjust: 100% !important;
      text-size-adjust: 100% !important;
      overflow-x: hidden !important;
      width: 100% !important;
      max-width: 100vw !important;
      position: relative !important;
    }

    *, *::before, *::after {
      touch-action: manipulation !important;
      -webkit-touch-callout: none !important;
    }

    /* Kange input auto-zoom a kowace wayar hannu (iOS Safari da Android Chrome) */
    input, select, textarea, [role="textbox"], [contenteditable="true"] {
      font-size: 16px !important;
    }
  </style>

  <script>
    (function () {
      // 1. Hana Multi-touch Pinch Zoom a Touchstart da Touchmove (Capture phase)
      function preventPinch(e) {
        if (e.touches && e.touches.length > 1) {
          if (e.cancelable) e.preventDefault();
        }
      }
      window.addEventListener('touchstart', preventPinch, { passive: false, capture: true });
      document.addEventListener('touchstart', preventPinch, { passive: false, capture: true });
      window.addEventListener('touchmove', preventPinch, { passive: false, capture: true });
      document.addEventListener('touchmove', preventPinch, { passive: false, capture: true });

      // 2. Hana iOS Safari native gesture events (pinch zoom)
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (eventName) {
        window.addEventListener(eventName, function (e) {
          if (e.cancelable) e.preventDefault();
        }, { passive: false, capture: true });
        document.addEventListener(eventName, function (e) {
          if (e.cancelable) e.preventDefault();
        }, { passive: false, capture: true });
      });

      // 3. Hana Double-Tap Zoom a Touchend
      var lastTouchEnd = 0;
      function preventDoubleTap(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          if (e.cancelable) e.preventDefault();
        }
        lastTouchEnd = now;
      }
      window.addEventListener('touchend', preventDoubleTap, { passive: false, capture: true });
      document.addEventListener('touchend', preventDoubleTap, { passive: false, capture: true });

      // 4. Hana dblclick
      window.addEventListener('dblclick', function (e) {
        if (e.cancelable) e.preventDefault();
      }, { passive: false, capture: true });

      // 5. Hana Ctrl + Wheel / Trackpad pinch zoom
      window.addEventListener('wheel', function (e) {
        if (e.ctrlKey && e.cancelable) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });

      // 6. Hana keyboard zoom (Ctrl + '+' / Ctrl + '-')
      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      }, { capture: true });

      // 7. Visual Viewport Reset: Idan browser ya canza scale, mayar da shi 1.0 nan take
      if (window.visualViewport) {
        var resetScale = function () {
          if (window.visualViewport.scale !== 1) {
            var meta = document.querySelector('meta[name="viewport"]');
            if (meta) {
              meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover';
            }
          }
        };
        window.visualViewport.addEventListener('resize', resetScale);
        window.visualViewport.addEventListener('scroll', resetScale);
      }

      // 8. Tabbatar da font-size 16px a kowane input lokacin da aka taba shi don hana focus-zoom
      document.addEventListener('focusin', function (e) {
        if (e.target && /^(INPUT|SELECT|TEXTAREA)$/i.test(e.target.tagName)) {
          e.target.style.fontSize = '16px';
        }
      }, { capture: true });
    })();
  </script>
