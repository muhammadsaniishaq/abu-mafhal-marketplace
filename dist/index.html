<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
  <title>Abu Mafhal Marketplace</title>

  <style>
    *, *::before, *::after, html, body, #root {
      touch-action: pan-x pan-y !important;
      -webkit-touch-callout: none !important;
    }
    html, body {
      -webkit-text-size-adjust: 100% !important;
      -moz-text-size-adjust: 100% !important;
           text-size-adjust: 100% !important;
      overflow-x: hidden !important;
    }
    @media screen and (max-width: 768px) {
      input, select, textarea, [role="textbox"], [contenteditable="true"] {
        font-size: 16px !important;
      }
    }
  </style>

  <script>
    (function () {
      // 1. Hana multi-touch a touchstart (Kafin ma browser ya fara gesture)
      function preventMultiTouch(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }
      window.addEventListener('touchstart', preventMultiTouch, { passive: false });
      document.addEventListener('touchstart', preventMultiTouch, { passive: false });

      // 2. Hana multi-touch a touchmove
      window.addEventListener('touchmove', preventMultiTouch, { passive: false });
      document.addEventListener('touchmove', preventMultiTouch, { passive: false });

      // 3. Hana iOS Safari Gesture events (pinch zoom)
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (eventName) {
        window.addEventListener(eventName, function (e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener(eventName, function (e) {
          e.preventDefault();
        }, { passive: false });
      });

      // 4. Hana Double-Tap Zoom a wayoyin hannu
      var lastTouchEnd = 0;
      function preventDoubleTap(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }
      window.addEventListener('touchend', preventDoubleTap, { passive: false });
      document.addEventListener('touchend', preventDoubleTap, { passive: false });

      // 5. Hana dblclick
      window.addEventListener('dblclick', function (e) {
        e.preventDefault();
      }, { passive: false });

      // 6. Hana Ctrl + Wheel / Trackpad pinch zoom
      window.addEventListener('wheel', function (e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>
