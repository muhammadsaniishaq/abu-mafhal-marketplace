<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
  <title>Abu Mafhal Marketplace</title>

  <style>
    html, body, #root {
      touch-action: pan-x pan-y !important;
      -webkit-text-size-adjust: 100% !important;
      -moz-text-size-adjust: 100% !important;
           text-size-adjust: 100% !important;
      overflow-x: hidden !important;
      -webkit-touch-callout: none;
    }
    @media screen and (max-width: 768px) {
      input, select, textarea, [role="textbox"], [contenteditable="true"] {
        font-size: 16px !important;
      }
    }
  </style>

  <script>
    // 1. Hana Pinch Zoom a iOS da Android (Gesture Prevention)
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturechange', function (e) {
      e.preventDefault();
    }, { passive: false });
    document.addEventListener('gestureend', function (e) {
      e.preventDefault();
    }, { passive: false });

    // 2. Hana Multi-touch Pinch a touchmove
    document.addEventListener('touchmove', function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // 3. Hana Double-Tap Zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // 4. Hana dblclick
    document.addEventListener('dblclick', function (e) {
      e.preventDefault();
    }, { passive: false });

    // 5. Hana Ctrl + Wheel Zoom (Trackpad pinch)
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
